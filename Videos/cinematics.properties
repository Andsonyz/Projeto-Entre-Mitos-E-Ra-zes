prologue.1.video=Videos/cena1.mp4
prologue.1.caption=O fogo avançava rápido demais pelas copas das árvores. Onde antes havia o verde vivo e o som da floresta, resta apenas a fumaça e o calor sufocante.

prologue.2.video=Videos/cena2.mp4
prologue.2.caption=Guiado pelo dever e pela coragem, o pequeno guardião avança entre as brasas. Sem hesitar, ele alcança o filhote assustado entre os galhos em chamas e o acolhe em seus braços.

